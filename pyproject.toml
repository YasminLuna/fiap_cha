[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "unit: testes isolados de regras de domínio",
  "integration: testes de integração da API e banco de dados",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__init__.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "htmlcov", ".terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
